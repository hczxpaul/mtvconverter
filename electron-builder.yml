appId: cc.photix.mtvconverter
productName: MTV Converter
copyright: Personal use only
directories:
  output: release
  buildResources: build
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  # 渲染层依赖已由 Vite 打包进 dist/renderer，运行期只需 zod；排除测试与示例以缩小产物
  - "!node_modules/**/{test,tests,__tests__,examples,example,docs}/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.map"
extraResources:
  - from: resources
    to: resources
    filter:
      - manifest.json
      - uvr/**
      - models/**
      - fonts/**
asar: true
mac:
  target:
    - dmg
    - dir
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 只带 macOS arm64 静态二进制：bin/ 下同时放了两套平台的 ffmpeg，全带会白塞 296MB
  extraResources:
    - from: resources
      to: resources
      filter:
        - manifest.json
        - "bin/ffmpeg"
        - "bin/ffprobe"
        - uvr/**
        - models/**
        - fonts/**
win:
  target:
    - nsis
    - dir
  artifactName: ${productName}-Setup-${version}.${ext}
  # 只带 Windows 版 ffmpeg.exe / ffprobe.exe（gyan 7.1-full，含 libass / libx265 / libsvtav1 / nvenc）
  extraResources:
    - from: resources
      to: resources
      filter:
        - manifest.json
        - "bin/ffmpeg.exe"
        - "bin/ffprobe.exe"
        - uvr/**
        - models/**
        - fonts/**
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish: null
